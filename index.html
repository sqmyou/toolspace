<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toolspace — small, fast tools that run in your browser</title>
    <meta
      name="description"
      content="A hundred small tools for text, data, images and code. They open in a tab and get on with it. No account, no tracking, no ads."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e12" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Installable app: iOS needs its own touch icon and looks at these
         flags rather than the manifest, and the icon must be a solid square
         because iOS ignores transparency. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="toolspace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Self-hosted type; preload the two faces used above the fold. -->
    <link
      rel="preload"
      href="./fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/ibm-plex-sans-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/ibm-plex-mono-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Theme before first paint, so there is no flash of the wrong palette. -->
    <script src="./theme-init.js"></script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="toolspace — small, fast tools that run in your browser" />
    <meta
      property="og:description"
      content="One page, a hundred small tools, all easing the job. No account, no sign-up, no server."
    />
    <meta property="og:url" content="https://toolspace.sirsamyoudev.workers.dev/" />
    <meta property="og:image" content="./icon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="toolspace — small, fast tools that run in your browser" />
    <meta
      name="twitter:description"
      content="One page, a hundred small tools, all easing the job. No account, no sign-up, no server."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
